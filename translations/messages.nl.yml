    onboardingMollie:
        btnBack: 'Ga terug'
        btnNext: 'Volgende'
        create: 'Klik op "maak" om Mollie op te slaan als betalingsmethode in het Sylius-beheer voordat u individuele betalingsmethoden configureert.'
        step_1:
            title: 'Laat mij u helpen'
            text: >-
                <p>Bedankt voor het installeren van Mollie voor betaaldiensten. Deze gids begeleidt u door de configuratie.</p>
            btnNext: 'Start onboarding-assistent'
            btnBack: 'Overslaan, ik weet hoe het werkt'
        step_2:
            title: 'Verbind met uw Mollie-account'
            text: >-
                <p>Om de Mollie-plugin met uw webshop te synchroniseren heeft u Mollie API-sleutels en profiel-ID nodig.</p>
            btnLogin: 'Inloggen op mijn account'
            btnRegister: 'Maak een Mollie-account'
        step_3:
            text: >-
                <p>Nu u verbonden bent met Mollie configureren we de omgeving en inloggegevens.</p>
                <p>Test is de standaardomgeving in de plugin.</p>
                <p>U hoeft de configuratie slechts één keer uit te voeren om TEST + LIVE omgevingen beschikbaar te hebben. Wissel eenvoudig tussen de twee.</p>
        step_4:
            text: >-
                <p>Vul uw gegevens correct in en klik op "Test API-sleutels" om een succesvol of mislukt resultaat te krijgen voor zowel LIVE als TEST-omgevingen.</p>
        step_5:
            text: >-
                <p>Vervolgens configureren we belangrijke instellingen voor de checkout-weergave op uw webshop.</p>
        step_6:
            text: >-
                <p>Het inschakelen van componenten stelt u in staat de velden voor creditcardgegevens aan uw eigen checkout toe te voegen.</p>
                <p>Als u NEEN selecteert, worden gebruikers doorgestuurd naar de Mollie-checkoutpagina.</p>
                <p>Lees meer over Mollie-componenten <a href="https://www.mollie.com/en/news/post/better-checkout-flows-with-mollie-components" target="_blank">hier</a>.</p>
        step_7:
            text: >-
                <p>Het inschakelen van single click-betalingen onthoudt de betaalvoorkeuren van uw consument om vervolgbetalingen te versnellen. Uw consument hoeft geen extra acties uit te voeren.</p>
                <p>Lees meer over single click-betalingen <a href="https://help.mollie.com/hc/en-us/articles/115000671249-What-are-single-click-payments-and-how-does-it-work-" target="_blank">hier</a>.</p>
        step_8:
            text: >-
                <p>Nu is het tijd om functies voor individuele betalingsmethoden aan te passen.</p>
                <p>Selecteer eerst de knop "Methoden laden". Alleen methoden die zijn ingeschakeld in uw Mollie-account worden hier weergegeven.</p>
                <p>Gebruik daarna de aan/uit-selector om te bepalen welke op de checkout-pagina van uw webshop verschijnen.</p>
                <p>Opmerking: u kunt de onboarding niet voortzetten zonder betalingsmethoden te laden.</p>
        step_9:
            text: >-
                <p>Voor elke methode kunt u hier een aangepaste titel invoeren - deze wordt weergegeven op uw checkout-pagina.</p>
        step_10:
            text: >-
                <p>Probeer een aangepaste afbeelding voor het betalingspictogram te uploaden. Deze wordt weergegeven op de checkout-pagina.</p>
        step_11:
            text: >-
                <p>Hier kunt u filters maken voor land-specifieke betalingsmethoden - bijvoorbeeld als u wilt dat iDEAL alleen voor Nederlandse klanten wordt weergegeven, kiest u "Selecteer landen" en selecteert u Nederland.</p>
        step_12:
            text: >-
                <p>Per methode kunt u selecteren welke Mollie API u gebruikt om betalingen te maken. Klik <a href="https://docs.mollie.com/orders/why-use-orders" target="_blank">hier</a> om meer te lezen over de verschillen tussen Orders API en Payments API.</p>
        step_13:
            1:
                title: 'Payments API'
                text: >-
                    <p>Wanneer u Payments API gebruikt, kunt u extra gegevens toevoegen om betalingen aan klantbestellingen te koppelen -- u kunt deze waarden hier invoeren, maar zorg ervoor dat u de juiste tags gebruikt zoals hieronder aangegeven.</p>
            2:
                title: 'Orders API'
                text: >-
                    <p>Dit is de door Mollie aanbevolen API voor webshops, omdat het u in staat stelt “orders” te maken. Een order bevat persoonlijke gegevens van een klant (bijv. adres) en producten die de klant heeft besteld. Bij een bestelling wordt automatisch een bijbehorende betaling aangemaakt.</p>
        step_14:
            text: >-
                <p>Als u kosten doorberekent aan de consument, kunt u deze hier toevoegen. Lees meer over kosten <a href="https://help.mollie.com/hc/en-us/articles/360012564454-Can-I-pass-over-the-costs-for-the-use-of-a-payment-method-to-my-customers-" target="_blank">hier</a>.</p>
        step_15:
            text: >-
                <p>Vergeet niet uw configuraties op te slaan.</p>
        step_16:
            title: 'U bent klaar!'
            text: >-
                <p>U kunt nu een klantbestelling op uw website proberen.</p>
            btnNext: 'Begin met Mollie'
        step_nav:
            1: 'Intro'
            2: 'API-instellingen'
            3: 'Winkelinstellingen'
            4: 'Betalingsinstellingen'
        step_open: 'Open'
        step_quit:
            cancel: 'Doorgaan met onboarding'
            confirm: 'Onboarding-assistent afsluiten'
            title: 'Weet u zeker dat u wilt stoppen?'
