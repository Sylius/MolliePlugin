    onboardingMollie:
        btnBack: 'Zurück'
        btnNext: 'Weiter'
        create: 'Bevor Sie einzelne Zahlungsmethoden konfigurieren, klicken Sie auf "Erstellen", um Mollie als Zahlungsmethode im Sylius-Admin-Panel zu speichern.'
        step_1:
            title: 'Lassen Sie mich helfen'
            text: >-
                <p>Vielen Dank, dass Sie Mollie für Zahlungsdienste installiert haben. Dieser Leitfaden führt Sie durch die Konfiguration.</p>
            btnNext: 'Onboarding-Assistent starten'
            btnBack: 'Überspringen, ich weiß, wie es funktioniert'
        step_2:
            title: 'Verbinden Sie sich mit Ihrem Mollie-Konto'
            text: >-
                <p>Um das Mollie-Plugin mit Ihrem Webshop zu synchronisieren, benötigen Sie Mollie-API-Schlüssel und Profil-ID.</p>
            btnLogin: 'In mein Konto einloggen'
            btnRegister: 'Ein Mollie-Konto erstellen'
        step_3:
            text: >-
                <p>Jetzt, wo Sie mit Mollie verbunden sind, konfigurieren wir die Umgebung und Zugangsdaten.</p>
                <p>Test ist die Standardumgebung im Plugin.</p>
                <p>Die Konfiguration muss nur einmal durchgeführt werden, um TEST + LIVE Umgebungen verfügbar zu haben. Einfach zwischen den beiden wechseln.</p>
        step_4:
            text: >-
                <p>Füllen Sie Ihre korrekten Daten aus und klicken Sie auf "Test-API-Schlüssel". Dies liefert ein erfolgreiches oder fehlerhaftes Ergebnis für LIVE- und TEST-Umgebungen.</p>
        step_5:
            text: >-
                <p>Als nächstes richten wir die Schlüsseloptionen für die Anzeige auf der Checkout-Seite Ihres Webshops ein.</p>
        step_6:
            text: >-
                <p>Das Aktivieren von Komponenten ermöglicht Ihnen, die Felder für Kreditkarteninhaberdaten in Ihrem Checkout hinzuzufügen.</p>
                <p>Wenn Sie NEIN auswählen, werden Nutzer auf die Mollie-Checkout-Seite weitergeleitet.</p>
                <p>Erfahren Sie mehr über Mollie-Komponenten <a href="https://www.mollie.com/en/news/post/better-checkout-flows-with-mollie-components" target="_blank">hier</a>.</p>
        step_7:
            text: >-
                <p>Das Aktivieren von Single-Click-Zahlungen speichert die Zahlungspräferenzen Ihres Kunden, um Folgezahlungen zu beschleunigen. Ihr Kunde muss keine zusätzlichen Aktionen durchführen.</p>
                <p>Erfahren Sie mehr über Single-Click-Zahlungen <a href="https://help.mollie.com/hc/en-us/articles/115000671249-What-are-single-click-payments-and-how-does-it-work-" target="_blank">hier</a>.</p>
        step_8:
            text: >-
                <p>Jetzt ist es Zeit, Funktionen für einzelne Zahlungsmethoden anzupassen.</p>
                <p>Wählen Sie zuerst die Schaltfläche "Methoden laden". Es werden nur die Methoden angezeigt, die in Ihrem Mollie-Konto aktiviert sind.</p>
                <p>Danach verwenden Sie den Aktivieren/Deaktivieren-Selektor, um zu steuern, welche auf der Checkout-Seite angezeigt werden.</p>
                <p>Hinweis: Die geführte Einrichtung kann ohne Laden der Zahlungsmethoden nicht fortgesetzt werden.</p>
        step_9:
            text: >-
                <p>Für jede Methode können Sie hier einen benutzerdefinierten Titel eingeben – dieser wird auf der Checkout-Seite angezeigt.</p>
        step_10:
            text: >-
                <p>Versuchen Sie, ein benutzerdefiniertes Bild für das Zahlungssymbol hochzuladen. Es wird auf der Checkout-Seite angezeigt.</p>
        step_11:
            text: >-
                <p>Hier können Sie Filter für länderspezifische Zahlungsmethoden erstellen – z. B. iDEAL nur für Kunden in den Niederlanden anzeigen.</p>
        step_12:
            text: >-
                <p>Pro Methode können Sie auswählen, welche Mollie-API für Zahlungen verwendet wird. Klicken Sie <a href="https://docs.mollie.com/orders/why-use-orders" target="_blank">hier</a>, um mehr über die Unterschiede zwischen Orders- und Payments-API zu erfahren.</p>
        step_13:
            1:
                title: 'Payments API'
                text: >-
                    <p>Bei Verwendung der Payments API können Sie zusätzliche Details eingeben, um Zahlungen mit Kundenbestellungen abzugleichen – verwenden Sie die richtigen Tags unten.</p>
            2:
                title: 'Orders API'
                text: >-
                    <p>Dies ist die von Mollie empfohlene API für Webshops, da Sie "Bestellungen" erstellen können. Eine Bestellung enthält Kundeninformationen und bestellte Produkte. Die Zahlung wird automatisch erstellt.</p>
        step_14:
            text: >-
                <p>Falls Gebühren an den Kunden weitergegeben werden, können Sie diese hier hinzufügen. Weitere Informationen zu Gebühren <a href="https://help.mollie.com/hc/en-us/articles/360012564454-Can-I-pass-over-the-costs-for-the-use-of-a-payment-method-to-my-customers-" target="_blank">hier</a>.</p>
        step_15:
            text: >-
                <p>Denken Sie daran, Ihre Konfigurationen zu speichern.</p>
        step_16:
            title: 'Alles bereit!'
            text: >-
                <p>Sie können jetzt eine Testbestellung auf Ihrer Website durchführen.</p>
            btnNext: 'Mollie verwenden starten'
        step_nav:
            1: 'Intro'
            2: 'API-Einstellungen'
            3: 'Shop-Einstellungen'
            4: 'Zahlungseinstellungen'
        step_open: 'Öffnen'
        step_quit:
            cancel: 'Onboarding fortsetzen'
            confirm: 'Onboarding-Assistent beenden'
            title: 'Möchten Sie den Assistenten wirklich beenden?'
