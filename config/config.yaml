imports:
    - { resource: "resources/**/*.yaml" }
    - { resource: "state_machine/*.php" }
    - { resource: "grids/**/*.yaml" }
    - { resource: "email/**/*.yaml" }
    - { resource: "fixtures/**/*.yaml" }
    - { resource: "twig_hooks/**/*.yaml" }
    - { resource: "workflow/**/*.yaml" }

    - { resource: "integration/refund-plugin/config.php" }

doctrine:
    dbal:
        types:
            # DBAL 4 removed the built-in "array" type the plugin's mappings rely on
            array: Sylius\MolliePlugin\Doctrine\DBAL\Type\ArrayType

bazinga_js_translation:
    locale_fallback: '%kernel.default_locale%'
